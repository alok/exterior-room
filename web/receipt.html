<body><a href="/">← Exterior Room</a><h1>The source receipt</h1><p>The live algebra comes from a native Lean executable. The picture uses Three.js. These are separate trust boundaries.</p><small>Local sources, exact pins, proof names, and limitations.</small><div id="documents">Loading local provenance…</div>
<script type="module">const root=document.querySelector('#documents');try{const result=await(await fetch('/api/provenance')).json();root.textContent='';for(const [name,text]of Object.entries(result.documents)){const heading=document.createElement('h2');heading.textContent=name;const pre=document.createElement('pre');pre.textContent=text;root.append(heading,pre);}}catch{root.textContent='The local server could not provide provenance. See docs/lean-provenance.md in the project.';}</script></body></html>
